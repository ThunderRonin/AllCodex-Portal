sonar.projectKey=ThunderRonin_allcodex-portal
sonar.organization=thunderronin

sonar.sources=app,lib,components
sonar.tests=tests
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,tests/**/*

# Exclude test files from copy-paste detection — Vitest's vi.mock() hoisting
# requires each test file to independently declare full mock surfaces, making
# mock boilerplate duplication a structural requirement (not a code smell).
sonar.cpd.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,tests/**/*

sonar.exclusions=node_modules/**,.next/**,bun.lock
